[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fvs2py"
version = "0.2.2"
description = "Python wrapper for the Forest Vegetation Simulator API."
authors = [
    { name = "David Diaz", email = "ddiaz@vibrantplanet.net" }
]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["forest", "growth", "yield", "fvs"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed"
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.1,<3",
    "pandas>=3.0,<4",
]

[project.scripts]
fvs = "fvs2py.cli:main"

[project.urls]
Homepage = "https://github.com/Vibrant-Planet-Open-Science/fvs2py"
Repository = "https://github.com/Vibrant-Planet-Open-Science/fvs2py"
Issues = "https://github.com/Vibrant-Planet-Open-Science/fvs2py/issues"
Changelog = "https://github.com/Vibrant-Planet-Open-Science/fvs2py/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "ipykernel==7.2.0",
    "mypy==2.1.0",
    "nbval==0.11.0",
    "pandas-stubs==3.0.0.260204",
    "pre-commit==4.6.0",
    "pytest-mock==3.15.1",
    "pytest==9.0.3",
    "ruff==0.15.13",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["fvs2py*"]
exclude = ["fvs2py.tests*"]

[tool.setuptools.package-data]
fvs2py = ["py.typed"]

[tool.uv]

[tool.ruff]
required-version = ">=0.11"
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]

line-length = 80
indent-width = 4

[tool.ruff.format]
preview = true

[tool.ruff.lint]
select = ["A", "ARG", "BLE", "C4", "COM", "D", "DTZ", "E", "EM", "EXE", "F", "FA", "FBT", "FIX", "G", "I", "ICN", "INP", "ISC", "PD", "PIE", "PT", "PYI", "Q", "RET", "RSE", "SIM", "SLF", "SLOT", "T10", "T20", "TD", "TID", "UP", "W", "YTT"]
ignore = ["COM812", "D100", "D104", "D107", "E501", "FIX002", "G004", "ISC001", "PYI041", "SLF001", "TD003"]

[tool.ruff.lint.isort]
known-first-party = ["fvs2py"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Ignore pydocstyle and generic df names in test files.
"test_*.py" = ["D", "PD901"]
"fvs2py/tests/*.py" = ["D", "PD901"]
"*.ipynb" = ["T201"]

[tool.mypy]
mypy_path = "fvs2py"
files = "fvs2py"

