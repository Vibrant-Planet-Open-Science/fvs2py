name: Release

# Release Please drives versioning from Conventional Commit formatting of PR 
# titles. On every push to main it checks for changes that would trigger any 
# version bump and when detected, opens and maintains a "Release PR" that 
# accumulates the changelog and the next semver bump. Merging that Release PR 
# creates the GitHub release + git tag, and is used to gate publishing to PyPI.

on:
  push:
    branches: [main]

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write         # create the release + tag, commit the Release PR
      pull-requests: write    # open/update the Release PR
    concurrency:
      group: release-please-${{ github.ref }}
      cancel-in-progress: false
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
  build:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: Build sdist and wheel
        run: uv build --out-dir dist
      - name: Check artifacts
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          set -euo pipefail
          test -f "dist/fvs2py-${VERSION}.tar.gz"
          test -f "dist/fvs2py-${VERSION}-py3-none-any.whl"
          python3 -m zipfile -l dist/*.whl
          tar -tzf dist/*.tar.gz
      - name: Smoke-test the built wheel
        run: |
          set -euo pipefail
          uv venv --python 3.12 /tmp/smoke
          uv pip install --python /tmp/smoke/bin/python dist/*.whl
          cd /tmp  # outside the repo, so the source tree can't shadow the install
          /tmp/smoke/bin/python - <<'PY'
          import pathlib
          import fvs2py
          from fvs2py import FVS  # noqa: F401
          p = pathlib.Path(fvs2py.__file__).parent
          assert "site-packages" in str(p), p
          assert (p / "py.typed").is_file(), "py.typed missing"
          assert not (p / "tests").exists(), "tests leaked into wheel"
          print("ok", p)
          PY
          /tmp/smoke/bin/fvs --help
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 30  # must outlive the wait for PyPI approval

  publish-testpypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/fvs2py
    permissions:
      id-token: write  # trusted publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
          print-hash: true

  publish-pypi:
    needs: publish-testpypi
    runs-on: ubuntu-latest
    environment:
      name: pypi  # requires reviewer approval
      url: https://pypi.org/p/fvs2py
    permissions:
      id-token: write  # trusted publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          print-hash: true
