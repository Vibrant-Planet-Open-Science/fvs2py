name: Release

# Release Please drives versioning from Conventional Commit formatting of PR 
# titles. On every push to main it checks for changes that would trigger any 
# version bump and when detected, opens and maintains a "Release PR" that 
# accumulates the changelog and the next semver bump. Merging that Release PR 
# creates the GitHub release + git tag, and is used to gate publishing to PyPI.

on:
  push:
    branches: [main]

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write         # create the release + tag, commit the Release PR
      pull-requests: write    # open/update the Release PR
    concurrency:
      group: release-please-${{ github.ref }}
      cancel-in-progress: false
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
  build:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Build sdist and wheel
        run: uv build --out-dir dist
      - name: Check artifacts
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          set -euo pipefail
          test -f "dist/fvs2py-${VERSION}.tar.gz"
          unzip -Z1 "dist/fvs2py-${VERSION}-py3-none-any.whl" > wheel.txt
          cat wheel.txt
          grep -qx 'fvs2py/py.typed' wheel.txt
          if grep '^fvs2py/tests/' wheel.txt; then echo "tests leaked into wheel"; exit 1; fi
      - name: Smoke-test the built wheel
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        run: uvx --from "dist/fvs2py-${VERSION}-py3-none-any.whl" fvs --help
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 30  # must outlive the wait for PyPI approval

  publish-testpypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/fvs2py
    permissions:
      id-token: write  # trusted publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
          print-hash: true

  publish-pypi:
    needs: publish-testpypi
    runs-on: ubuntu-latest
    environment:
      name: pypi  # requires reviewer approval
      url: https://pypi.org/p/fvs2py
    permissions:
      id-token: write  # trusted publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          print-hash: true
