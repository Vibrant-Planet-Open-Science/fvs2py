name: Pytest

on: [pull_request]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15, windows-latest]
        python: ["3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}

      - name: Check uv.lock is up to date
        run: uv lock --check

      - run: uv sync --frozen --extra dev

      - run: uv run pytest fvs2py

      # Temporary: find what aborts the macOS 15 process at exit.
      - name: Diagnose macOS abort
        if: failure() && runner.os == 'macOS'
        run: |
          probe() { uv run python -c "$1"; echo "exit $? <- $1"; }
          probe "from fvs2py import FVS"
          probe "from fvs2py import FVS; FVS('so')"
          probe "from fvs2py import FVS; FVS('so').close()"
          probe "from fvs2py import FVS; FVS('so').close(); FVS('pn').close()"
          for f in fvs2py/tests/test_*.py; do
            uv run pytest -q "$f" > /dev/null 2>&1; echo "exit $? <- $f"
          done
          for f in ~/Library/Logs/DiagnosticReports/*.ips; do
            echo "== $f"; head -c 20000 "$f"
          done

  nbval:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Fetch PR base commit
        run: |
          git fetch --no-tags origin "${{ github.event.pull_request.base.sha }}"

      - name: List changed notebooks
        id: notebooks
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          if ! git rev-parse --verify --quiet "${BASE_SHA}^{commit}" >/dev/null; then
            echo "Base commit ${BASE_SHA} is not available after fetch." >&2
            exit 1
          fi
          if ! git rev-parse --verify --quiet "${HEAD_SHA}^{commit}" >/dev/null; then
            echo "Head commit ${HEAD_SHA} is not available after checkout." >&2
            exit 1
          fi

          if ! git diff -z --name-only --diff-filter=AM \
            "${BASE_SHA}...${HEAD_SHA}" -- '*.ipynb' > /tmp/changed-notebooks; then
            echo "git diff failed for ${BASE_SHA}...${HEAD_SHA}" >&2
            exit 1
          fi
          mapfile -d '' -t notebooks < /tmp/changed-notebooks

          if [ "${#notebooks[@]}" -eq 0 ]; then
            echo "skip=true" >> "${GITHUB_OUTPUT}"
            echo "No notebooks changed in this PR; skipping nbval."
            exit 0
          fi

          printf 'Changed notebooks:\n'
          printf -- ' - %s\n' "${notebooks[@]}"
          printf '%s\0' "${notebooks[@]}" > "${GITHUB_WORKSPACE}/.ci-changed-notebooks"

          echo "skip=false" >> "${GITHUB_OUTPUT}"

      - uses: astral-sh/setup-uv@v10.3.3
        if: steps.notebooks.outputs.skip != 'true'
        with:
          enable-cache: true

      - name: Run nbval-lax on changed notebooks
        if: steps.notebooks.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          uv sync --frozen --extra dev
          mapfile -d '' -t notebooks < .ci-changed-notebooks
          uv run pytest --nbval-lax "${notebooks[@]}"
