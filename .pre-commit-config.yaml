repos:
- repo: https://github.com/gitleaks/gitleaks
  rev: v8.30.1
  hooks:
    - id: gitleaks
      entry: gitleaks detect --source . --redact --verbose
      pass_filenames: false 
- repo: https://github.com/astral-sh/ruff-pre-commit
  # Ruff version.
  rev: v0.15.13
  hooks:
    # Run the linter.
    - id: ruff
      args: [ --fix ]
    # Run the formatter.
    - id: ruff-format
# Runs the project's own mypy so it sees numpy and pandas types and the
# pyproject.toml pins; mirrors-mypy's isolated env treated them as Any.
- repo: local
  hooks:
    - id: mypy
      name: mypy
      entry: uv run --extra dev mypy
      language: system
      types: [python]
      pass_filenames: false
